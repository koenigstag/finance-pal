name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      # No Nx Cloud workspace is connected, and the daemon only helps interactive use.
      NX_NO_CLOUD: 'true'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No test needs a database: specs are unit-level, and migrations aren't exercised here.
      - run: pnpm nx run-many -t lint typecheck test build
