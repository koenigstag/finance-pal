packages:
  - 'apps/*'
  - 'libs/*/*'

# pnpm blocks dependency postinstall scripts by default.
# Only packages that genuinely need to build native binaries are allowed here.
allowBuilds:
  '@swc/core': true
  nx: true
  esbuild: true
  argon2: true
  unrs-resolver: true
  '@parcel/watcher': true
  less: false
