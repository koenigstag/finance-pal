<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FinancePal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Browser chrome (address bar, status bar) follows the system theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <!-- The scalable one where it is understood, the .ico for everything else. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <!-- iOS has no manifest support for standalone mode; these are how it learns the same. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinancePal" />
    <meta name="description" content="Personal and shared budgets: accounts, categories and transactions." />
    <script>
      // Applies the theme before first paint, so a dark page doesn't flash light while the bundle
      // loads. Mirrors src/stores/theme-store.ts, which takes over once the app starts.
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('ft.theme') || 'system';
        } catch (error) {}
        var dark =
          preference === 'dark' ||
          (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
